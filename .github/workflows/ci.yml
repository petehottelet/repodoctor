name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pinned: an unpinned linter makes CI non-reproducible.
      - run: pip install ruff==0.16.0
      - run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the skill runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run the offline test suite
        run: python -m pytest -v

  skill-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build the skill from the tested commit
        run: python tools/skill_archive.py --out "$RUNNER_TEMP/skill-dist"
      - name: Verify against the released runtime
        run: |
          python -m venv "$RUNNER_TEMP/skill-runtime"
          "$RUNNER_TEMP/skill-runtime/bin/python" -m pip install -r runtime.txt
          python tools/skill_archive.py --verify "$RUNNER_TEMP/skill-dist/"*.zip --python "$RUNNER_TEMP/skill-runtime/bin/python"
