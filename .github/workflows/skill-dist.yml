name: Repo Doctor distribution

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-doctor-dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check that the release tag matches VERSION
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Build the exact source snapshot
        run: python tools/skill_archive.py --out "$RUNNER_TEMP/skill-dist"
      - name: Install and verify the pinned released runtime
        run: |
          python -m venv "$RUNNER_TEMP/skill-runtime"
          "$RUNNER_TEMP/skill-runtime/bin/python" -m pip install -r runtime.txt
          python tools/skill_archive.py --verify "$RUNNER_TEMP/skill-dist/"*.zip --python "$RUNNER_TEMP/skill-runtime/bin/python"
      - uses: actions/upload-artifact@v6
        with:
          name: repo-doctor-skill
          path: ${{ runner.temp }}/skill-dist/*
          if-no-files-found: error

  attach:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: repo-doctor-skill
          path: skill-dist
      - name: Attach verified immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" skill-dist/* --repo "$REPOSITORY"
